services:
  payment-provider:
    build:
      context: ../../../
      dockerfile: Dockerfile
    volumes:
      - ./local-payment-provider.config.yaml:/config.yaml:ro
    ports:
      - "${SNAPSHOT_PORT:-8082}:8080"
    environment:
      - PORT=8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
